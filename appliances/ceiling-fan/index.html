<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ceiling Fan · How Shit Works</title>
  <meta name="description" content="How a ceiling fan works: outer-rotor induction motor, capacitor start, bearings, and blades, in 7 steps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/src/base.css">
  <link rel="stylesheet" href="./page.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="brand">
      <div class="kicker"><a href="/" style="text-decoration:none;pointer-events:auto">How Shit Works</a> · No. 01</div>
      <h1>Ceiling Fan</h1>
    </div>
    <div class="hud">
      <button class="btn primary" id="play">Pause</button>
      <label for="explode">Explode</label>
      <input type="range" id="explode" min="0" max="100" value="0">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="5" value="3">
    </div>
  </div>
  <aside class="panel">
    <div class="panel-head">
      <div class="kicker">The story in 7 steps</div>
      <div style="color:var(--muted);font-size:13px;margin-top:6px">Drag to orbit. Tap a step to focus a part.</div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="panel-foot">
      <button class="btn" id="prev">Back</button>
      <button class="btn" id="next">Next</button>
    </div>
  </aside>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>

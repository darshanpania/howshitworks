<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="brand">
      <nav class="crumbs" aria-label="Site">
        <a class="home-link" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>All appliances</a>
        <span class="kicker"><span class="site-name">How Shit Works · </span>No. 11</span>
      </nav>
      <h1>Window AC</h1>
      <dl class="readout" id="readout" aria-live="off">
        <div><dt>Room</dt><dd id="r-room">31.0°C</dd></div>
        <div><dt>Air out</dt><dd id="r-air">18.0°C</dd></div>
        <div><dt>Compressor</dt><dd id="r-comp">On</dd></div>
      </dl>
    </div>
    <div class="hud">
      <button class="btn primary play" id="play" type="button" aria-pressed="true" aria-label="Pause animation">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.86l10-6.4a1 1 0 0 0 0-1.72l-10-6.4a1 1 0 0 0-1.5.86z"/></svg>
      </button>
      <button class="btn controls-toggle" id="controls-toggle" type="button" aria-label="Controls" aria-expanded="false" aria-controls="hud-controls">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="label">Controls</span>
      </button>
      <div class="hud-controls" id="hud-controls">
        <div class="control"><label for="explode">Explode</label><output id="explode-out" for="explode">0%</output><input type="range" id="explode" min="0" max="100" value="0"></div>
        <div class="control"><label for="set">Set</label><output id="set-out" for="set">24°C</output><input type="range" id="set" min="16" max="30" value="24"></div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <div class="panel-head">
      <div class="panel-meta"><div class="kicker">The story in 8 steps</div><span class="count" id="progress-count" aria-hidden="true">01 / 08</span></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Story progress" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"></div>
      <p class="hint">Drag to orbit. Tap a step to focus a part.</p>
      <p class="keys"><kbd>←</kbd> <kbd>→</kbd> to step · <kbd>Space</kbd> to pause · <kbd>E</kbd> to explode</p>
    </div>
    <div class="steps" id="steps"></div>
    <div class="panel-foot">
      <button class="btn" id="prev" type="button" disabled>Back</button>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
  </aside>
